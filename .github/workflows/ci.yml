# Pull requests must build and pass the end-to-end tests before merging
# (enforced by branch protection on main, which requires this job).
name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build and end-to-end tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build SoundMatrix.csproj -c Release -warnaserror

      - name: End-to-end tests
        run: dotnet test tests/SoundMatrix.Tests --logger "console;verbosity=normal"

      - name: Build installer
        shell: pwsh
        run: |
          dotnet publish SoundMatrix.csproj -c Release -r win-x64 --self-contained -o publish
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /DAppVersion=0.0.0 installer\SoundMatrix.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
