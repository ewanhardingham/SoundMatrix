# Every push to main builds a self-contained installer and publishes it as a GitHub release.
# Versions are 0.1.<run number>, so each release is newer than the last.
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Pick version
        id: version
        shell: pwsh
        run: '"version=0.1.${{ github.run_number }}" >> $env:GITHUB_OUTPUT'

      - name: Publish
        run: dotnet publish SoundMatrix.csproj -c Release -r win-x64 --self-contained -p:Version=${{ steps.version.outputs.version }} -o publish

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /DAppVersion=${{ steps.version.outputs.version }} installer\SoundMatrix.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          gh release create "v$v" "dist/SoundMatrix-Setup-$v.exe" `
            --target "${{ github.sha }}" --title "SoundMatrix $v" --generate-notes
